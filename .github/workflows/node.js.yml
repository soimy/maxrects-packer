# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - name: Checkout 
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - run: npm ci
    - run: npm run lint
    - run: npm run format:check
    - run: npm run typecheck
    # Documentation boundaries: the site source is tracked, the build products are ignored, and
    # docs:clean may only delete the build products. Needs no build, so it runs before the tests.
    - run: npm run verify:docs
    # The boundary check above says the files are in the right place; this one says the site still
    # builds from them, so a broken VitePress or TypeDoc configuration cannot pass CI.
    - run: npm run docs:build
    - run: npm run cover
    # Must run after the build: it verifies require/import **by package name** against the real
    # tarball produced by npm pack
    - run: npm run verify:package
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      if: matrix.node-version == '24.x'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
      